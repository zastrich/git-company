name: Publish to npm

# Publica o pacote no npm automaticamente quando um push chega na main
# (merge de PR ou commit direto) E a versão do package.json ainda não existe
# no registro. Assim, publicar = fazer bump da versão (npm version ...).

on:
  push:
    branches: [main]
    paths:
      - 'package.json'          # só faz sentido avaliar publish quando o manifesto muda
      - 'lib/**'
      - 'app/**'
      - 'cli/**'
      - 'scheduler/**'
      - 'bin/**'
      - 'prisma/**'
      - 'next.config.ts'
      - '.github/workflows/publish.yml'
  workflow_dispatch: {}         # permite disparar manualmente pela aba Actions

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (engines multiplataforma)
        run: npx prisma generate

      - name: Ler versão local e a publicada
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Versão $LOCAL já publicada — nada a fazer."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Versão $LOCAL ainda não publicada — irá publicar."
          fi

      - name: Build (standalone) + limpeza de artefatos
        if: steps.version.outputs.should_publish == 'true'
        run: npm run prepack

      - name: Publish
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
